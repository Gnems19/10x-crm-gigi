<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — 10X CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body class="theme-dark">
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-lockup" role="img" aria-label="10X CRM">
            <svg class="logo-10x" width="86" viewBox="0 0 60 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><g clip-path="url(#svg-clip0)"><path d="M59.9994 13.0728H4.75012V21.5028H59.9994V13.0728Z" fill="#7250FC"/><path d="M0 12.1057H4.7245V7.33415H1.69273V3.38485C3.9493 3.22053 5.1014 2.27978 5.64203 0.42334H10.2492V12.1057H14.504V17.2773H0V12.1057Z" class="fill-foreground"/><path d="M20.1209 16.807C17.0654 15.5376 15.3726 12.9988 15.3726 8.95602V8.90898C15.3726 7.02871 15.8192 5.43005 16.6652 4.11362C18.405 1.43372 21.5314 0 25.5742 0C27.5486 0 29.3115 0.352474 30.8161 1.03421C33.8717 2.44472 35.6817 5.10079 35.6817 8.88515V8.97923C35.6817 10.9536 35.2584 12.5754 34.4123 13.8919C32.7196 16.5009 29.617 17.7471 25.5272 17.7471C23.4588 17.7471 21.6719 17.4417 20.1209 16.807ZM29.8289 8.95602C29.8289 6.18204 28.1832 4.98351 25.5272 4.98351C22.8711 4.98351 21.2254 6.2529 21.2254 8.9328V8.95602C21.2254 11.518 22.8241 12.7642 25.5033 12.7642C28.1826 12.7642 29.8283 11.6597 29.8283 8.95602H29.8289Z" class="fill-foreground"/><path d="M42.4746 17.2774H35.7281L42.2865 10.1552L36.2926 3.64392H42.8509L45.6481 6.84062L48.4453 3.64392H54.9566L48.9859 10.2023L55.2388 17.2774H48.6805L45.6011 13.6341L42.4746 17.2774Z" class="fill-foreground"/></g><defs><clipPath id="svg-clip0"><rect width="60" height="21.5027" fill="white"/></clipPath></defs></svg>
            <span class="brand-suffix" aria-hidden="true">CRM</span>
          </span>
        </div>
        <h1>Welcome back</h1>
        <form id="login-form" novalidate>
          <p class="form-error" id="login-global-error"></p>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" autocomplete="email" />
            <span class="field-error" id="email-error"></span>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" />
            <span class="field-error" id="password-error"></span>
          </div>
          <button type="submit" class="btn btn-primary">Log In</button>
        </form>
        <p class="auth-footer">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
